<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPX Schedule — October 2026</title>
<style>
:root{
  --navy:#0d1117;--navy2:#161b22;--navy3:#21262d;--border:#30363d;
  --green:#2ea043;--green2:#3fb950;--yellow:#d29922;--red:#f85149;
  --blue:#58a6ff;--purple:#bc8cff;--orange:#f0883e;--pink:#f778ba;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
.app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{width:300px;min-width:300px;background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-head h2{font-size:15px;font-weight:600;color:var(--text);margin-bottom:2px}
.sidebar-head .sub{font-size:11px;color:var(--text2)}
.clock-bar{background:var(--navy3);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:8px}
.clock-badge{background:#1f2937;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;font-family:monospace;color:var(--blue);letter-spacing:.5px}
.clock-label{font-size:11px;color:var(--text2)}
.whosOn{flex:1;overflow-y:auto;padding:12px}
.wo-section{margin-bottom:14px}
.wo-section-head{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 6px;border-radius:4px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.wo-live .wo-section-head{background:rgba(46,160,67,.15);color:var(--green2)}
.wo-soon .wo-section-head{background:rgba(210,153,34,.12);color:var(--yellow)}
.wo-later .wo-section-head{background:rgba(88,166,255,.08);color:var(--blue)}
.wo-done .wo-section-head{background:rgba(139,148,158,.08);color:var(--text3)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green2);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.wo-card{background:var(--navy3);border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.wo-card.live{border-left:3px solid var(--green2)}
.wo-card.soon{border-left:3px solid var(--yellow)}
.wo-card.later{border-left:3px solid var(--blue)}
.wo-card.done{opacity:.5}
.wo-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.g1-av{background:rgba(88,166,255,.2);color:var(--blue)}
.g2-av{background:rgba(63,185,80,.2);color:var(--green2)}
.g3-av{background:rgba(240,136,62,.2);color:var(--orange)}
.wo-info{flex:1;min-width:0}
.wo-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-shift{font-size:10px;color:var(--text2);margin-top:1px}
.wo-badge{font-size:10px;padding:2px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.wo-badge.live{background:rgba(46,160,67,.2);color:var(--green2)}
.wo-badge.soon{background:rgba(210,153,34,.2);color:var(--yellow)}
.wo-badge.later{background:rgba(88,166,255,.15);color:var(--blue)}
.wo-badge.done{background:rgba(139,148,158,.1);color:var(--text3)}
.wo-empty{text-align:center;padding:20px;color:var(--text3);font-size:12px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--navy2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:700;color:var(--text);flex:1}
.nav-btn{background:var(--navy3);border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:5px 12px;cursor:pointer;font-size:12px}
.nav-btn:hover{background:var(--border);color:var(--text)}
.today-btn{background:rgba(88,166,255,.1);border-color:var(--blue);color:var(--blue)}
.today-btn:hover{background:rgba(88,166,255,.2)}
.day-label{font-size:13px;font-weight:600;color:var(--text);min-width:120px;text-align:center}
.tab-bar{background:var(--navy2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;gap:4px;flex-shrink:0}
.tab{padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:12px;color:var(--text2);border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
.tab:hover{color:var(--text);background:var(--navy3)}
.tab.active{color:var(--text);background:var(--navy);border-color:var(--border);border-bottom-color:var(--navy)}
.content{flex:1;overflow:auto;padding:16px}

.sched-table{border-collapse:collapse;width:max-content;min-width:100%}
.sched-table th,.sched-table td{padding:0;border:none}
.wk-header{background:var(--navy3);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);text-align:center;padding:5px 4px;border:1px solid var(--border)}
.wk-header.cur{background:rgba(88,166,255,.08);color:var(--blue);border-color:rgba(88,166,255,.3)}
.day-th{background:var(--navy3);font-size:10px;color:var(--text2);text-align:center;padding:4px 2px;border:1px solid var(--border);min-width:92px;max-width:92px;width:92px}
.day-th.today{background:rgba(88,166,255,.1);color:var(--blue)}
.day-th .dn{font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.4px}
.day-th .dd{font-size:11px;font-weight:600;margin-top:1px}
.name-th{background:var(--navy3);font-size:11px;font-weight:600;color:var(--text);padding:4px 8px;border:1px solid var(--border);min-width:150px;max-width:150px;text-align:left;position:sticky;left:0;z-index:5}
.section-row td{background:rgba(88,166,255,.06);color:var(--blue);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:5px 8px;border:1px solid var(--border)}
.emp-name-cell{background:var(--navy2);border:1px solid var(--border);padding:4px 8px;position:sticky;left:0;z-index:3}
.emp-name{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.emp-tz{font-size:9px;color:var(--text3);margin-top:1px}
.sc{border:1px solid var(--border);text-align:center;padding:2px;height:36px;vertical-align:middle;cursor:pointer;position:relative}
.sc:hover{filter:brightness(1.2)}
.sv{font-size:11px;font-weight:500;line-height:1.2}
.sc.g3 .sv{font-size:10px}
.s-early{background:rgba(188,140,255,.12);color:var(--purple)}
.s-mid{background:rgba(88,166,255,.1);color:var(--blue)}
.s-late{background:rgba(46,160,67,.1);color:var(--green2)}
.s-night{background:rgba(240,136,62,.1);color:var(--orange)}
.s-overnight{background:rgba(248,113,113,.1);color:var(--red)}
.s-off{background:transparent;color:var(--text3)}
.s-blank{background:transparent}
.s-today{outline:2px solid var(--blue);outline-offset:-2px}
.s-predict{background:rgba(46,160,67,.15);color:var(--green2)}
.note-dot{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--yellow);opacity:.8}

.event-row td{background:var(--navy3);border:1px solid var(--border);padding:3px 4px;text-align:center;font-size:10px}
.ev-pill{display:inline-flex;align-items:center;gap:3px;background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.25);border-radius:10px;padding:2px 6px;color:var(--yellow);font-size:9px;white-space:nowrap}

.nc-row td{border:1px solid var(--border);padding:3px 4px;text-align:center;font-size:10px;color:var(--text2)}
/* DAY VIEW */
.day-view{max-width:700px}
.dv-head{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text)}
.dv-section{margin-bottom:20px}
.dv-section-title{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text2);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.dv-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;margin-bottom:4px;background:var(--navy2);border:1px solid var(--border)}
.dv-row:hover{border-color:var(--blue)}
.dv-name{font-size:12px;font-weight:600;min-width:140px}
.dv-shift{font-size:11px;color:var(--text2)}
.dv-off{opacity:.35}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--navy2);border:1px solid var(--border);border-radius:12px;padding:20px;width:340px;max-width:90vw}
.modal h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text)}
.modal textarea{width:100%;background:var(--navy3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px;font-size:12px;resize:vertical;min-height:80px;font-family:inherit}
.modal-footer{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.btn-save{background:var(--green);border:none;border-radius:6px;color:#fff;padding:6px 16px;cursor:pointer;font-size:12px}
.btn-clear{background:var(--navy3);border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:6px 16px;cursor:pointer;font-size:12px}
.btn-cancel{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:6px 16px;cursor:pointer;font-size:12px}
/* Star badge */
.star-badge{position:absolute;top:1px;left:2px;font-size:9px;line-height:1}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--navy)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.events-legend{font-size:10px;color:var(--text2);padding:8px 16px;border-top:1px solid var(--border);background:var(--navy2);flex-shrink:0}
/* Directory */
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.dir-card{background:var(--navy2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px;transition:border-color .15s,background .15s}

.dir-av{background:rgba(210,153,34,.25);color:var(--yellow)}
.lead-av{background:rgba(188,140,255,.2);color:var(--purple)}

</head>

// ── HELPERS ────────────────────────────────────────────
function getCurrentETMinutes(){
  const now=new Date();
  let m=(now.getUTCHours()-4)*60+now.getUTCMinutes();
  if(m<0) m+=1440;
  return m;
}
function parseShiftWindow(shift){
  if(!shift) return null;
  const s=shift.trim().toUpperCase();
  if(!s||s==='OFF'||s==='HOLIDAY'||s==='ON CALL'||s==='JURY DUTY') return null;
  const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)\s*[-–]\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/);
  if(!m) return null;
  let sh=parseInt(m[1]),sm=parseInt(m[2]||0),sap=m[3];
  let eh=parseInt(m[4]),em=parseInt(m[5]||0),eap=m[6];
  if(sap==='PM'&&sh!==12) sh+=12;
  if(sap==='AM'&&sh===12) sh=0;
  if(eap==='PM'&&eh!==12) eh+=12;
  if(eap==='AM'&&eh===12) eh=0;
  let start=sh*60+sm, end=eh*60+em;
  if(end<=start) end+=1440;
  return {start,end};
}
function abbrevShift(shift){
  return shift.replace(/(\d+(?::\d+)?)\s*(AM|PM)/gi,(_,t,ap)=>{
    const time=t.replace(/:00$/,'');
    return time+ap.charAt(0).toLowerCase();
  }).replace(/\s*-\s*/g,'-');
}
function fmtCountdown(mins){
  if(mins<60) return `${mins}m`;
  return `${Math.floor(mins/60)}h ${mins%60}m`;
}
function shiftClass(shift){
  if(!shift) return 's-blank';
  const sl=shift.toLowerCase().trim();
  if(sl===''||sl==='tbd') return 's-blank';
  if(sl==='off') return 's-off';
  if(sl==='holiday'||sl==='on call'||sl==='jury duty') return 's-off';
  if(sl.startsWith('5 am')||sl.startsWith('6 am')||sl.startsWith('7 am')) return 's-early';
  if(sl.startsWith('8 am')||sl.startsWith('8:3')||sl.startsWith('9 am')||sl.startsWith('10 am')||sl.startsWith('10:3')||sl.startsWith('11 am')||sl.startsWith('11:3')) return 's-mid';
  if(sl.startsWith('12 pm')||sl.startsWith('12:3')||sl.startsWith('1 pm')||sl.startsWith('2 pm')||sl.startsWith('3 pm')) return 's-late';
  if(sl.startsWith('4 pm')||sl.startsWith('5 pm')||sl.startsWith('6 pm')) return 's-night';
  if(sl.startsWith('7 pm')||sl.startsWith('8 pm')||sl.startsWith('9 pm')||sl.startsWith('10 pm')) return 's-overnight';
  return 's-mid';
}

}

function renderWhosOn(){
  const ti=findTodayIndex();
  if(ti<0){document.getElementById('whosOn').innerHTML='<div class="wo-empty">No data for today</div>';return;}
  const now=getCurrentETMinutes();
  const buckets={live:[],soon:[],later:[],done:[]};
  ALL_EMP.forEach(e=>{
    const shift=e.s[ti];
    if(!shift||shift.toUpperCase()==='OFF') return;
    const w=parseShiftWindow(shift);
    if(!w) return;
    const {start,end}=w;
    let state;
    // For overnight shifts end > 1440, compare accordingly
    if(now>=start && now<end) state='live';
    else if(now<start && (start-now)<=180) state='soon';
    else if(now<start) state='later';
    else state='done';
    buckets[state].push({e,shift,w,state});
  });
  let h='';

  if(buckets.soon.length){
    h+=`<div class="wo-section wo-soon"><div class="wo-section-head">⏳ Starting Soon (${buckets.soon.length})</div>`;
    buckets.soon.sort((a,b)=>a.w.start-b.w.start).forEach(({e,shift,w})=>{

    });
    h+='</div>';
  }
  if(buckets.later.length){
    h+=`<div class="wo-section wo-later"><div class="wo-section-head">🕐 Later Today (${buckets.later.length})</div>`;
    buckets.later.sort((a,b)=>a.w.start-b.w.start).forEach(({e,shift,w})=>{

      evs.forEach(ev=>{ h+=`<div class="ev-pill">${ev.logos.join('')}</div>`; });
      h+='</td>';
    } else {
      h+='<td class="sc s-blank"></td>';
    }
  }
  h+='</tr>';
  // G1
  h+=sectionRow('SBK');
  G1.forEach(e=>{ h+=empRow(e,1); });
  // G2
  h+=sectionRow('FlyWheelOps');
  G2.forEach(e=>{ h+=empRow(e,2); });
  // G3
  h+=sectionRow('Racing Ops');
  G3.forEach(e=>{ h+=empRow(e,3); });
  h+='</tbody></table>';
  return h;
}
// ── DAY VIEW ──────────────────────────────────────────
function renderDayView(){
  const i=selectedDay;
  const d=DATES[i];
  const ti=findTodayIndex();
  const isToday=(i===ti);
  const nowM=isToday?getCurrentETMinutes():-1;
  let h=`<div class="day-view"><div class="dv-head">${d.dy} · ${d.d}</div>`;
  function renderSection(arr,label,g){
    const working=arr.filter(e=>{
      const s=e.s[i];
      return s&&s.toUpperCase()!=='OFF'&&s!=='';
    });
    const off=arr.filter(e=>{
      const s=e.s[i];
      return !s||s.toUpperCase()==='OFF';
    });
    h+=`<div class="dv-section"><div class="dv-section-title">${label}</div>`;
    if(!working.length&&!off.length){h+='<div style="color:var(--text3);font-size:11px">No data</div>';}
    working.forEach(e=>{
      const shift=e.s[i];
      const w=parseShiftWindow(shift);
      let stateBadge='';
      if(isToday&&w){
        if(nowM>=w.start&&nowM<w.end) stateBadge='<span class="wo-badge live" style="margin-left:8px">LIVE</span>';
        else if(nowM<w.start&&w.start-nowM<=180) stateBadge=`<span class="wo-badge soon" style="margin-left:8px">in ${fmtCountdown(w.start-nowM)}</span>`;
      }
      h+=`<div class="dv-row"><div class="dv-name">${e.n}</div><div class="dv-shift">${shift}${e.tz?' · '+e.tz:''}</div>${stateBadge}</div>`;
    });
    if(off.length){
      h+='<div style="margin-top:6px">';
      off.forEach(e=>{h+=`<div class="dv-row dv-off"><div class="dv-name">${e.n}</div><div class="dv-shift">${e.s[i]||'–'}</div></div>`;});
      h+='</div>';
    }
    h+='</div>';
  }
  renderSection(G1,'SBK',1);
  renderSection(G2,'FlyWheelOps',2);
  renderSection(G3,'Racing Ops',3);
  h+='</div>';
  return h;
}

  ];

    const initials=p.n.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase();

    const shiftBadge=todayShift&&todayShift!=='OFF'?
      `<span style="font-size:9px;background:rgba(88,166,255,.12);color:var(--blue);border-radius:8px;padding:1px 7px;margin-left:6px">${todayShift}</span>`:'';
    const rpt=p.reportsTo?`<div style="font-size:10px;color:var(--text3);margin-top:2px">↳ reports to ${p.reportsTo}</div>`:'';
    return `<a href="${slack}" target="_blank" style="text-decoration:none;color:inherit">
      <div class="dir-card">
        <div class="wo-avatar ${grp}" style="width:36px;height:36px;font-size:13px;flex-shrink:0">${initials}</div>

function filterDir(q){
  const ql=q.toLowerCase().trim();
  const cards=document.querySelectorAll('.dir-card');
  cards.forEach(c=>{
    const txt=c.innerText.toLowerCase();
    c.closest('a').style.display=(!ql||txt.includes(ql))?'':'none';
  });
}
